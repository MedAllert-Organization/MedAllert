name: Node.js CI

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: medallert-backend/package-lock.json
    - name: Install dependencies
      run: npm ci
      working-directory: medallert-backend
    - name: Build
      run: npm run build --if-present
      working-directory: medallert-backend
    - name: Test
      run: npm test
      working-directory: medallert-backend 
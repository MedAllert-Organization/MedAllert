name: Backend CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  test:
    name: Run tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medallert-backend

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run gen

      - name: Type check (strict)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  merge-to-develop:
    name: Create and merge PR into develop
    needs: test
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/develop' && github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PR to develop
        id: create_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branch = process.env.GITHUB_REF.replace('refs/heads/', '');
            const title = `Automated merge ${branch} -> develop`;
            const body = 'CI passed, creating automated PR to develop.';
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: 'develop',
              title,
              body,
              maintainer_can_modify: true
            });
            return pr.number;

      - name: Attempt to merge PR (squash)
        id: merge_pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt(core.getInput('pr-number') || '${{ steps.create_pr.outputs.result }}');
            // Try to merge the PR
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash'
              });
              return 'merged';
            } catch (err) {
              core.info('Could not merge automatically: ' + err.message);
              return 'not-merged';
            }
